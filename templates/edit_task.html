<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #2c3e50;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            margin-right: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>Edit Task</h1>
    <nav>
        <a href="{{ url_for('home') }}">Home</a> | 
        <a href="{{ url_for('add_task') }}">Add Task</a> | 
        <a href="{{ url_for('stats') }}">Statistics</a>
    </nav>
    <hr>

    <form method="POST">
        <label for="title">Task Title:</label>
        <input type="text" id="title" name="title" value="{{ task.title }}" required>
        
        <label for="category">Category:</label>
        <input type="text" id="category" name="category" value="{{ task.category }}" required>
        
        <button type="submit">Update Task</button>
    </form>
</body>
</html>
