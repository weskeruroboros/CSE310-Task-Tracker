<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #2c3e50;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            margin-right: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #f9fafc;
            border: 1px solid #e1e8ed;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .actions a {
            text-decoration: none;
            margin-left: 10px;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            color: white;
        }
        .btn-toggle { background-color: #e67e22; }
        .btn-edit { background-color: #3498db; }
        .btn-delete { background-color: #e74c3c; }
        .actions a:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <h1>My Tasks</h1>
    <nav>
        <a href="{{ url_for('home') }}">Home</a> | 
        <a href="{{ url_for('add_task') }}">Add Task</a> | 
        <a href="{{ url_for('stats') }}">Statistics</a>
    </nav>
    <hr>

    <ul>
        {% for task in tasks %}
            <li>
                <div>
                    <strong>{{ task.title }}</strong><br>
                    <small>Category: {{ task.category }} | Status: <em>{{ task.status }}</em></small>
                </div>
                <div class="actions">
                    <a href="{{ url_for('complete_task', task_id=task.id) }}" class="btn-toggle">Toggle</a>
                    <a href="{{ url_for('edit_task', task_id=task.id) }}" class="btn-edit">Edit</a>
                    <a href="{{ url_for('delete_task', task_id=task.id) }}" class="btn-delete">Delete</a>
                </div>
            </li>
        {% else %}
            <p>No tasks found. Add one to get started!</p>
        {% endfor %}
    </ul>
</body>
</html>
