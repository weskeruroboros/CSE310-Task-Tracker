<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker Web App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        nav { margin-bottom: 20px; background: #333; padding: 10px; border-radius: 5px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .Completed { text-decoration: line-through; color: gray; }
        .btn { padding: 5px 10px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home (Tasks)</a>
        <a href="/add">Add New Task</a>
        <a href="/stats">Task Statistics</a>
    </nav>
    <div class="card">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
