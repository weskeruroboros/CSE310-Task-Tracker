<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Statistics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #2c3e50;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            margin-right: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #f9fafc;
            border: 1px solid #e1e8ed;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <h1>Task Statistics</h1>
    <nav>
        <a href="{{ url_for('home') }}">Home</a> | 
        <a href="{{ url_for('add_task') }}">Add Task</a> | 
        <a href="{{ url_for('stats') }}">Statistics</a>
    </nav>
    <hr>
    
    <ul>
        <li><span>Total Tasks:</span> <strong>{{ total }}</strong></li>
        <li><span>Completed Tasks:</span> <strong style="color: #2ecc71;">{{ completed }}</strong></li>
        <li><span>Pending Tasks:</span> <strong style="color: #e67e22;">{{ pending }}</strong></li>
    </ul>
</body>
</html>
